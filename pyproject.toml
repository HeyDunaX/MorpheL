[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "morphel-tokenizer"
version = "0.1.0"
description = "MorpheL: MI-guided stochastic morphology-aware tokenizer for pretrained models"
readme = "README.md"
license = { file = "LICENSE_PENDING.md" }
requires-python = ">=3.10"
keywords = ["nlp", "tokenization", "morphology", "multilingual", "huggingface"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.24",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "datasets>=2.14",
    "tokenizers>=0.15",
    "transformers>=4.38",
    "huggingface-hub>=0.20",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "types-tqdm>=4.65",
]
downstream = [
    "torch>=2.1",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]
stats = [
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.scripts]
morphel = "morphel.cli:app"

[project.urls]
Repository = "https://github.com/anonymous-submission/morphel"
"Bug Tracker" = "https://github.com/anonymous-submission/morphel/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/morphel"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "configs/",
    "metadata/",
    "docs/",
    "examples/",
    "README.md",
    "LICENSE_PENDING.md",
    "CITATION.cff",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations (public functions)
    "RUF", # ruff-specific rules
]
ignore = [
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls
    "ANN401",  # Dynamically typed expressions (Any)
    "B008",    # Do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
"examples/**" = ["ANN", "T201"]
"scripts/**" = ["ANN", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 99
target-version = ["py310", "py311", "py312"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/morphel"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "gpu: requires a CUDA GPU (skipped on CPU-only CI)",
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "network: requires internet access to download datasets",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/morphel"]
branch = true
omit = [
    "src/morphel/downstream/*",   # Stubs; not testable without GPU
    "src/morphel/hub.py",         # Requires HF credentials
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
