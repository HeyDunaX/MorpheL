experiment:
  name: morphel-standard-chinese-32k
  seed: 42

language:
  code: zh
  name: Chinese
  vowels: ""
  word_boundary_policy: TODO_PROJECT_OWNER_SPECIFY_SEGMENTER
  lowercase: false
  notes: "Vowel filter disabled. Requires custom word segmenter."

dataset:
  name: facebook/xnli
  subset: zh
  revision: null
  induction_splits:
    - train
    - validation
    - test
  evaluation_splits:
    - validation
    - test
  text_columns:
    - premise
    - hypothesis

tokenizer:
  vocab_size: 32000
  min_frequency: 2
  top_k: 4
  temperature: 1.0
  mi_threshold: 0.0
  model_max_length: 512
  use_vowel_boundary_filter: false
  special_tokens:
    - "<s>"
    - "<pad>"
    - "</s>"
    - "<unk>"
    - "<mask>"

output:
  directory: outputs/tokenizers/morphel-zh-32k
  hub_repo: null
  overwrite: false
