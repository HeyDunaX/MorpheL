experiment:
  regime: A
  description: "Frozen encoder + frozen WECHSEL embeddings; only head trainable."
  seed: 42

model:
  base_architecture: "xlm-roberta-base"
  embedding_initialization: "wechsel"
  frozen_parameters:
    - "encoder"
    - "embeddings"
  trainable_parameters:
    - "classifier"

training:
  learning_rate: 2.0e-5
  batch_size: 32
  max_epochs: 10
  patience: 3
  checkpoint_metric: "eval_accuracy"
